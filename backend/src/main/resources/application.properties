spring.application.name=E-MEDICAPP
server.address=${EMEDICAPP_ADDRESS:127.0.0.1}
server.port=${EMEDICAPP_PORT:8082}
server.forward-headers-strategy=NONE
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${EMEDICAPP_SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${EMEDICAPP_DB_URL:jdbc:postgresql://127.0.0.1:55432/emedicapp_demo}
spring.datasource.username=${EMEDICAPP_DB_USER:emedicapp}
spring.datasource.password=${EMEDICAPP_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
emedicapp.mode=${EMEDICAPP_MODE:DEMO}
emedicapp.documents.storage-dir=${EMEDICAPP_DOCUMENTS_DIR:./.runtime/documents}
emedicapp.security.secure-cookies=${EMEDICAPP_SECURE_COOKIES:false}
emedicapp.security.public-url=${EMEDICAPP_PUBLIC_URL:}
emedicapp.security.allowed-origins=${EMEDICAPP_ALLOWED_ORIGINS:}
emedicapp.bootstrap.admin-email=${EMEDICAPP_ADMIN_EMAIL:}
emedicapp.bootstrap.admin-password=${EMEDICAPP_ADMIN_PASSWORD:}

emedicapp.business-zone=${EMEDICAPP_BUSINESS_ZONE:America/Argentina/Mendoza}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${EMEDICAPP_BUSINESS_ZONE:America/Argentina/Mendoza}'
