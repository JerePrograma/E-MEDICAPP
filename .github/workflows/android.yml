name: Android Ionic y Capacitor

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-main
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Verificar frontend
        working-directory: frontend
        run: npm test
      - name: Compilar y sincronizar Android
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://scalaris.com.ar/e-medicapp
        run: npm run android:sync
      - name: Generar APK de prueba y AAB sin firma
        working-directory: frontend/android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: emedicapp-android-${{ github.sha }}
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
